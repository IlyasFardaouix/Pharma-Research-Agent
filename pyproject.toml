[project]
name = "pharma-research-agent"
version = "0.1.0"
description = "Agentic research assistant over a local pharmacology corpus (GenAI Bootcamp assignment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "numpy==2.3.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "langchain-core==1.8.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "openai==3.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.setuptools.package-data]
eval = ["*.yaml", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
